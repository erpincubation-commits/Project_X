[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-on-prem"
version = "0.1.0"
description = "On-premises ERP MVP foundation"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
